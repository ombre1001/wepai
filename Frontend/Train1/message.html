<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小猪佩奇</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/message.css">
</head>
<body>
    <div class="slid-container">
        <div class="slider">
            <div class="slide">
                <iframe src="//player.bilibili.com/player.html?isOutside=true&aid=215605025&bvid=BV1Fa411p78M&cid=763794153&p=1&autoplay=0" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>
                <div class="slide-content">
                    <h2>开头纯享</h2>
                    <p>还记得佩奇一家的经典开头吗？</p>
                </div>
            </div>
            <div class="slide">
                <iframe src="//player.bilibili.com/player.html?isOutside=true&aid=490313984&bvid=BV1AN411q7b6&cid=1249172426&p=1&autoplay=0" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>
                <div class="slide-content">
                    <h2>猪语纯享</h2>
                    <p>一起聆听他们的声音</p>
                </div>
            </div>
            <div class="slide">
                <iframe src="//player.bilibili.com/player.html?isOutside=true&aid=115207615547829&bvid=BV1f8puzAEMQ&cid=32397984655&p=1&autoplay=0" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>
                <div class="slide-content">
                    <h2>世子之争</h2>
                    <p>佩奇与乔治，世子之争，向来如此</p>
                </div>
            </div>
        </div>
        
        <div class="slider-controls">
            <button class="slider-btn prev-btn">&lt;</button>
            <button class="slider-btn next-btn">&gt;</button>
        </div>
        
        <div class="slider-indicators">
        </div>
    </div>

    <nav>
        <div class="nav-container">
            <a href="./index.html" class="nav-item ">首页</a>
            <a href="./character.html" class="nav-item ">主要人物</a>
            <a href="./message.html" class="nav-item active">留言墙</a>
        </div>
    </nav>

    <div class="content">
    
        <div class="container">
            <!-- 左侧 -->
            <div class="message-form">
                <div class="form-header">
                    <h2>Family留言墙</h2>
                </div>
                
                <form id="messageForm">
                    <div class="form-group">
                        <label for="author">你的称呼</label>
                        <input type="text" id="author" class="form-control" placeholder="如：小羊肖恩，小鼠杰瑞" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="content">留言内容</label>
                        <textarea id="content" class="form-control" placeholder="写下你想对大家说的话" required></textarea>
                    </div>
                    
                    <button type="submit" class="btn">张贴留言</button>
                </form>
            </div>
            
            <!-- 右侧 -->
            <div class="message-display">
                <div class="display-header">
                    <h2>小道消息</h2>
                </div>
                
                <div class="message-list" id="messageList">
                </div>
            </div>
        </div>
        
    </div>

    <footer>
        <p>小猪佩奇 </p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const messageForm = document.getElementById('messageForm');
            const messageList = document.getElementById('messageList');
            

            initMessageBoard();

            messageForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const author = document.getElementById('author').value.trim();
                const content = document.getElementById('content').value.trim();
                
                if (author && content) {
                    addMessage(author, content);
                    messageForm.reset();
                }
            });
            
    
            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2);
            }
            

            function initMessageBoard() {
                const savedMessages = localStorage.getItem('alleyMessages');
                let messages = [];
                
                if (savedMessages) {
                    messages = JSON.parse(savedMessages);
                } 

                renderMessages(messages);
            }
            
            function addMessage(author, content) {
                const now = new Date();
                const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
                const newMessage = {
                    id: generateId(),
                    author,
                    content,
                    date: dateStr
                };
                
                const messages = getMessages();
                
                messages.unshift(newMessage);
        
                saveMessages(messages);
                renderMessages(messages);
            }
            

            function deleteMessage(id) {
                if (confirm('确定要删除这条留言吗？')) {
  
                    let messages = getMessages();
                    messages = messages.filter(msg => msg.id !== id);
        
                    saveMessages(messages);
                    renderMessages(messages);
                }
            }

            function getMessages() {
                const savedMessages = localStorage.getItem('alleyMessages');
                return savedMessages ? JSON.parse(savedMessages) : [];
            }
            
            function saveMessages(messages) {
                localStorage.setItem('alleyMessages', JSON.stringify(messages));
            }
            
            function renderMessages(messages) {
                messageList.innerHTML = '';
                
                messages.forEach(msg => {
                    const messageItem = document.createElement('div');
                    messageItem.className = 'message-item';
                    messageItem.dataset.id = msg.id;
                    messageItem.innerHTML = `
                        <button class="delete-btn" title="删除留言">×</button>
                        <div class="message-content">${msg.content}</div>
                        <div class="message-meta">
                            <span class="message-author">${msg.author}</span>
                            <span class="message-date">${msg.date}</span>
                        </div>
                    `;
  
                    const deleteBtn = messageItem.querySelector('.delete-btn');
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteMessage(msg.id);
                    });
                    
                    messageList.appendChild(messageItem);
                });
            }
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const slider = document.querySelector('.slider');
            const slides = document.querySelectorAll('.slide');
            const prevBtn = document.querySelector('.prev-btn');
            const nextBtn = document.querySelector('.next-btn');
            const indicatorsContainer = document.querySelector('.slider-indicators');
            
            let currentIndex = 0;
            const slideCount = slides.length;
            let slideInterval;
            

            function createIndicators() {
                for (let i = 0; i < slideCount; i++) {
                    const indicator = document.createElement('div');
                    indicator.classList.add('indicator');
                    if (i === currentIndex) {
                        indicator.classList.add('active');
                    }
                    indicator.addEventListener('click', () => {
                        goToSlide(i);
                    });
                    indicatorsContainer.appendChild(indicator);
                }
            }
            

            function updateIndicators() {
                const indicators = document.querySelectorAll('.indicator');
                indicators.forEach((indicator, index) => {
                    if (index === currentIndex) {
                        indicator.classList.add('active');
                    } else {
                        indicator.classList.remove('active');
                    }
                });
            }
            

            function initSlider() {
                createIndicators();
                updateSlider();
                startAutoSlide();
            }
            

            function updateSlider() {
                slider.style.transform = `translateX(-${currentIndex * 100}%)`;
                updateIndicators();
            }
            

            function startAutoSlide() {
                slideInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % slideCount;
                    updateSlider();
                }, 5000);
            }
            

            function resetAutoSlide() {
                clearInterval(slideInterval);
                startAutoSlide();
            }
            

            function goToPrev() {
                currentIndex = (currentIndex - 1 + slideCount) % slideCount;
                updateSlider();
                resetAutoSlide();
            }
            

            function goToNext() {
                currentIndex = (currentIndex + 1) % slideCount;
                updateSlider();
                resetAutoSlide();
            }
            

            function goToSlide(index) {
                currentIndex = index;
                updateSlider();
                resetAutoSlide();
            }
            

            prevBtn.addEventListener('click', goToPrev);
            nextBtn.addEventListener('click', goToNext);

            slider.addEventListener('mouseenter', () => {
                clearInterval(slideInterval);
            });
            
            slider.addEventListener('mouseleave', startAutoSlide);
            

            initSlider();
        });
    </script>
    
</body>
</html>
